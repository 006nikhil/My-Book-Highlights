name: Keep Scheduled Workflows Alive

# GitHub disables scheduled workflows in public repos after 60 days with no
# commits. This makes a tiny empty commit on the 1st of every month so the
# daily highlight workflow never gets switched off.

on:
  schedule:
    - cron: "23 3 1 * *"   # 3:23 AM UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make an empty keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: prevent scheduled workflows from being disabled"
          git push
