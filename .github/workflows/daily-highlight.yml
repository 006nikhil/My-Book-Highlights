name: Send Daily Highlight

on:
  schedule:
    # 2:17 AM UTC = 7:47 AM IST. An off-the-hour minute is used because
    # GitHub delays jobs scheduled at :00 the most; this should land ~8 AM IST.
    - cron: "17 2 * * *"
  workflow_dispatch: {}
    # ^ lets you manually trigger a test run from the Actions tab in GitHub,
    # without waiting for the schedule.

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send highlight(s) to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CATEGORY_FILTER: ""
          NUM_HIGHLIGHTS: "2"
        run: python send_highlight.py
